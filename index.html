<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Hành trình Toán học – Game Toán THCS Lớp 6–9</title>
  
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Toán THCS">

  <!-- KaTeX CSS & JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>

  <style>
/* ==========================================================================
   HÀNH TRÌNH TOÁN HỌC - DESIGN SYSTEM & RESPONSIVE STYLES
   ========================================================================== */

:root {
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --primary-light: #e0e7ff;
  --secondary: #06b6d4;
  --accent: #f59e0b;
  --success: #10b981;
  --danger: #ef4444;
  --warning: #f97316;

  --bg-dark: #0f172a;
  --bg-card: #1e293b;
  --bg-card-hover: #273549;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --border: #334155;
  
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-full: 9999px;

  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
  --shadow-md: 0 6px 18px rgba(0, 0, 0, 0.35);
  --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.4);

  --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

/* Base & Reset */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: var(--font-sans);
  background-color: var(--bg-dark);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  user-select: none;
}

/* App Container */
#app-root {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  padding-bottom: 74px; /* Space for bottom nav on mobile */
}

@media (min-width: 900px) {
  #app-root {
    padding-bottom: 24px;
  }
}

/* Header & Status Bar */
.app-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(15, 23, 42, 0.88);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand-section {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
}

.brand-logo {
  font-size: 26px;
  width: 42px;
  height: 42px;
  background: linear-gradient(135deg, #6366f1, #a855f7);
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
}

.brand-info h1 {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: -0.3px;
  background: linear-gradient(to right, #38bdf8, #818cf8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.brand-info p {
  font-size: 11px;
  color: var(--text-muted);
}

/* User status chips in header */
.header-stats {
  display: flex;
  align-items: center;
  gap: 10px;
}

.stat-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  background: var(--bg-card);
  padding: 6px 12px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border);
  font-size: 13px;
  font-weight: 700;
}

.stat-chip.energy { color: #f43f5e; border-color: rgba(244, 63, 94, 0.3); }
.stat-chip.streak { color: #f59e0b; border-color: rgba(245, 158, 11, 0.3); }
.stat-chip.xp { color: #10b981; border-color: rgba(16, 185, 129, 0.3); }

/* Role Switcher Pill */
.role-pill {
  cursor: pointer;
  background: rgba(99, 102, 241, 0.2);
  border: 1px solid rgba(99, 102, 241, 0.4);
  color: #c7d2fe;
  padding: 6px 14px;
  border-radius: var(--radius-full);
  font-size: 12px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s ease;
}

.role-pill:hover {
  background: rgba(99, 102, 241, 0.35);
  border-color: #818cf8;
}

/* Bottom Navigation (Mobile First) */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 64px;
  background: rgba(15, 23, 42, 0.95);
  backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 99;
  max-width: 1200px;
  margin: 0 auto;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  text-decoration: none;
  font-size: 11px;
  font-weight: 600;
  gap: 3px;
  cursor: pointer;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  transition: all 0.2s ease;
  background: transparent;
  border: none;
}

.nav-item .nav-icon {
  font-size: 20px;
}

.nav-item.active {
  color: #38bdf8;
  transform: translateY(-2px);
}

.nav-item.active .nav-icon {
  filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6));
}

/* Content Views */
.view-container {
  padding: 16px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Kingdom & Grade Switcher Tabs */
.kingdom-selector {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 6px;
  scrollbar-width: none;
}

.kingdom-selector::-webkit-scrollbar {
  display: none;
}

.kingdom-tab {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  border-radius: var(--radius-full);
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s ease;
}

.kingdom-tab.active {
  color: #ffffff;
  border-color: #6366f1;
  box-shadow: 0 0 16px rgba(99, 102, 241, 0.35);
}

.kingdom-tab[data-grade="6"].active { background: linear-gradient(135deg, #059669, #10b981); border-color: #34d399; }
.kingdom-tab[data-grade="7"].active { background: linear-gradient(135deg, #0891b2, #06b6d4); border-color: #38bdf8; }
.kingdom-tab[data-grade="8"].active { background: linear-gradient(135deg, #7c3aed, #8b5cf6); border-color: #a78bfa; }
.kingdom-tab[data-grade="9"].active { background: linear-gradient(135deg, #d97706, #f59e0b); border-color: #fbbf24; }

/* Chapter & Journey Path */
.journey-container {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.chapter-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  transition: transform 0.2s;
}

.chapter-header {
  padding: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  background: rgba(255, 255, 255, 0.02);
}

.chapter-title-group h3 {
  font-size: 16px;
  font-weight: 800;
  color: #f1f5f9;
}

.chapter-title-group span {
  font-size: 12px;
  color: var(--text-muted);
}

.chapter-boss-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(239, 68, 68, 0.15);
  border: 1px solid rgba(239, 68, 68, 0.4);
  color: #fca5a5;
  padding: 4px 10px;
  border-radius: var(--radius-full);
  font-size: 11px;
  font-weight: 700;
}

/* Winding Path of Lessons */
.lesson-path {
  padding: 24px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  position: relative;
}

.path-node-wrapper {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  transition: transform 0.2s ease;
}

.path-node-wrapper:active {
  transform: scale(0.95);
}

/* Stagger positions for winding adventure trail effect */
.path-node-wrapper:nth-child(even) { transform: translateX(45px); }
.path-node-wrapper:nth-child(odd) { transform: translateX(-45px); }
.path-node-wrapper:nth-child(4n) { transform: translateX(65px); }
.path-node-wrapper:nth-child(4n-2) { transform: translateX(-65px); }
.path-node-wrapper.boss-node { transform: translateX(0) !important; }

.lesson-bubble {
  width: 68px;
  height: 68px;
  border-radius: 50%;
  background: linear-gradient(135deg, #3b82f6, #1d4ed8);
  border: 4px solid #60a5fa;
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  position: relative;
}

.lesson-bubble.locked {
  background: #334155;
  border-color: #475569;
  box-shadow: none;
  opacity: 0.6;
}

.lesson-bubble.boss {
  width: 82px;
  height: 82px;
  background: linear-gradient(135deg, #dc2626, #991b1b);
  border: 4px solid #f87171;
  box-shadow: 0 0 24px rgba(220, 38, 38, 0.6);
  font-size: 32px;
  animation: pulse-glow 2s infinite;
}

@keyframes pulse-glow {
  0%, 100% { transform: scale(1); filter: brightness(1); }
  50% { transform: scale(1.05); filter: brightness(1.2); }
}

.node-stars {
  position: absolute;
  bottom: -8px;
  display: flex;
  gap: 2px;
  background: rgba(15, 23, 42, 0.9);
  padding: 2px 6px;
  border-radius: var(--radius-full);
  border: 1px solid #475569;
  font-size: 10px;
}

.node-title-label {
  margin-top: 8px;
  max-width: 140px;
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: #cbd5e1;
  line-height: 1.3;
}

/* Modals & Dialogs */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(8px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}

.modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.modal-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-md);
  display: flex;
  flex-direction: column;
  transform: translateY(20px);
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

.modal-overlay.active .modal-card {
  transform: translateY(0);
}

.modal-header {
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-header h3 {
  font-size: 18px;
  font-weight: 700;
}

.modal-close-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 22px;
  cursor: pointer;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-full);
}

.modal-close-btn:hover {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
}

.modal-body {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Level Selection Cards inside Lesson Modal */
.level-cards-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.level-select-card {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.level-select-card:hover:not(.locked) {
  background: rgba(99, 102, 241, 0.15);
  border-color: #6366f1;
  transform: translateY(-2px);
}

.level-select-card.locked {
  opacity: 0.5;
  cursor: not-allowed;
}

.level-badge {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  color: #38bdf8;
}

.level-stars-row {
  display: flex;
  gap: 3px;
  font-size: 14px;
}

/* ==========================================================================
   GAMEPLAY SCREEN (ARENA)
   ========================================================================== */
.game-arena {
  display: flex;
  flex-direction: column;
  gap: 16px;
  max-width: 680px;
  margin: 0 auto;
  width: 100%;
}

.game-top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.timer-bar-wrap {
  flex: 1;
  height: 12px;
  background: var(--bg-card);
  border-radius: var(--radius-full);
  overflow: hidden;
  border: 1px solid var(--border);
}

.timer-bar-fill {
  height: 100%;
  width: 100%;
  background: linear-gradient(to right, #10b981, #38bdf8);
  border-radius: var(--radius-full);
  transition: width 0.1s linear, background-color 0.3s;
}

.timer-bar-fill.warning {
  background: #f59e0b;
}

.timer-bar-fill.danger {
  background: #ef4444;
}

.game-combo-pill {
  background: linear-gradient(135deg, #f59e0b, #ef4444);
  color: white;
  padding: 4px 12px;
  border-radius: var(--radius-full);
  font-size: 12px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 4px;
  animation: bounce 0.6s infinite alternate;
}

@keyframes bounce {
  from { transform: translateY(0); }
  to { transform: translateY(-3px); }
}

.question-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  box-shadow: var(--shadow-sm);
}

.question-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.question-type-tag {
  background: rgba(99, 102, 241, 0.15);
  border: 1px solid rgba(99, 102, 241, 0.3);
  color: #c7d2fe;
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: var(--radius-full);
}

.question-stem {
  font-size: 18px;
  font-weight: 600;
  line-height: 1.5;
  color: #f8fafc;
}

/* Options Grid for MCQ */
.options-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

@media (min-width: 600px) {
  .options-grid {
    grid-template-columns: 1fr 1fr;
  }
}

.option-btn {
  background: rgba(255, 255, 255, 0.03);
  border: 2px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px;
  color: var(--text-main);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all 0.15s ease;
}

.option-btn:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: #6366f1;
}

.option-btn.selected {
  border-color: #38bdf8;
  background: rgba(56, 189, 248, 0.15);
}

.option-btn.correct {
  border-color: #10b981 !important;
  background: rgba(16, 185, 129, 0.25) !important;
  color: #a7f3d0 !important;
}

.option-btn.wrong {
  border-color: #ef4444 !important;
  background: rgba(239, 68, 68, 0.25) !important;
  color: #fecaca !important;
}

.option-letter {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 13px;
  flex-shrink: 0;
}

/* Error Detective (ERR Question) */
.err-steps-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.err-step-card {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  transition: all 0.2s ease;
}

.err-step-card:hover {
  background: rgba(239, 68, 68, 0.1);
  border-color: #f87171;
}

.err-step-card.selected-wrong {
  background: rgba(239, 68, 68, 0.25);
  border-color: #ef4444;
}

/* Ordering Question (ORDER) */
.order-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.order-item {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
}

.order-btns-group {
  display: flex;
  gap: 4px;
}

.order-nav-btn {
  background: rgba(255, 255, 255, 0.08);
  border: none;
  color: white;
  width: 28px;
  height: 28px;
  border-radius: var(--radius-sm);
  cursor: pointer;
}

/* Boss Battle Widget */
.boss-arena-header {
  background: linear-gradient(135deg, rgba(220, 38, 38, 0.2), rgba(15, 23, 42, 0.9));
  border: 1px solid rgba(220, 38, 38, 0.4);
  border-radius: var(--radius-lg);
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 16px;
}

.boss-avatar-box {
  font-size: 48px;
  width: 72px;
  height: 72px;
  background: rgba(0, 0, 0, 0.4);
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 16px rgba(220, 38, 38, 0.5);
  animation: boss-pulse 1.8s infinite;
}

@keyframes boss-pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

.boss-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.boss-hp-bar {
  height: 14px;
  background: rgba(0, 0, 0, 0.5);
  border-radius: var(--radius-full);
  overflow: hidden;
  border: 1px solid rgba(239, 68, 68, 0.4);
}

.boss-hp-fill {
  height: 100%;
  width: 100%;
  background: linear-gradient(to right, #ef4444, #f97316);
  border-radius: var(--radius-full);
  transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

/* Math Keypad */
.math-keypad {
  background: #0b1120;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-shadow: var(--shadow-md);
}

.keypad-row {
  display: flex;
  gap: 6px;
}

.keypad-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
}

.kp-btn {
  height: 48px;
  border: none;
  background: #1e293b;
  color: #f1f5f9;
  font-size: 18px;
  font-weight: 700;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.1s, transform 0.05s;
}

.kp-btn:active {
  transform: scale(0.96);
  background: #334155;
}

.kp-fn {
  flex: 1;
  background: #312e81;
  color: #c7d2fe;
}

.kp-op {
  background: #1e1b4b;
  color: #a5b4fc;
}

.kp-del {
  background: #450a0a;
  color: #fca5a5;
}

.kp-clear {
  background: #374151;
  color: #cbd5e1;
}

.kp-submit {
  grid-column: span 2;
  background: linear-gradient(135deg, #10b981, #059669);
  color: white;
  font-size: 14px;
}

.kp-zero {
  grid-column: span 2;
}

/* ==========================================================================
   ADMIN PORTAL & MONITORING
   ========================================================================== */
.admin-container {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.admin-header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

.admin-kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
}

.kpi-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.kpi-label {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 600;
}

.kpi-value {
  font-size: 26px;
  font-weight: 800;
  color: #f8fafc;
}

.kpi-sub {
  font-size: 11px;
  color: #10b981;
  font-weight: 600;
}

/* Admin Tabs */
.admin-tabs {
  display: flex;
  gap: 8px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 8px;
  overflow-x: auto;
}

.admin-tab-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}

.admin-tab-btn.active {
  background: rgba(99, 102, 241, 0.2);
  color: #818cf8;
}

/* Data Tables */
.table-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 13px;
}

.data-table th {
  background: rgba(255, 255, 255, 0.02);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  color: var(--text-muted);
  font-weight: 700;
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: 0.5px;
}

.data-table td {
  padding: 14px 16px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  color: #e2e8f0;
}

.data-table tr:hover td {
  background: rgba(255, 255, 255, 0.02);
}

.tag-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 8px;

  font-size: 11px;
  font-weight: 700;
}

.tag-badge.flagged { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 20px;
  border-radius: var(--radius-md);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  border: none;
  transition: all 0.2s ease;
  text-decoration: none;
}

.btn-primary {
  background: linear-gradient(135deg, #4f46e5, #6366f1);
  color: white;
  box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
}

.btn-primary:hover {
  background: linear-gradient(135deg, #4338ca, #4f46e5);
  transform: translateY(-1px);
}

.btn-success {
  background: linear-gradient(135deg, #059669, #10b981);
  color: white;
}

.btn-danger {
  background: #dc2626;
  color: white;
}

.btn-secondary {
  background: #334155;
  color: #f1f5f9;
}

.btn-sm {
  padding: 6px 12px;
  font-size: 12px;
  border-radius: var(--radius-sm);
}

/* Forms */
.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-group label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
}

.form-control {
  background: #0f172a;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  color: white;
  font-size: 14px;
  outline: none;
}

.form-control:focus {
  border-color: #6366f1;
}

/* Leaderboard */
.leaderboard-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.lb-row {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;

.lb-row.top-2 { border-color: #94a3b8; background: linear-gradient(135deg, rgba(148, 163, 184, 0.1), var(--bg-card)); }
.lb-row.top-3 { border-color: #d97706; background: linear-gradient(135deg, rgba(217, 119, 6, 0.1), var(--bg-card)); }

.lb-rank {

  width: 28px;

.lb-student {

.lb-avatar {

.lb-name {

}

.lb-sub {

  color: var(--text-muted);
}

.lb-score {
  font-weight: 800;
  color: #38bdf8;
  font-size: 15px;
}

/* Utilities */
.text-center { text-align: center; }
.text-success { color: var(--success); }
.text-danger { color: var(--danger); }
.text-warning { color: var(--warning); }

// Audio Synthesizer using Web Audio API (Zero external MP3 dependencies)
class SoundFX {
  constructor() {
    this.ctx = null;
    this.enabled = true;
    this.initialized = false;
  }

  init() {
    if (!this.ctx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) {
        this.ctx = new AudioContext();
        this.initialized = true;
      }
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  toggle(enable) {
    this.enabled = enable !== undefined ? enable : !this.enabled;
    return this.enabled;
  }

  playClick() {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, now);
    osc.frequency.exponentialRampToValueAtTime(400, now + 0.04);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.04);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.05);
  }

  playCorrect(combo = 1) {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const baseFreq = 523.25; // C5
    const semitones = [0, 4, 7, 12, 16]; // Major arpeggio
    const offset = Math.min(combo - 1, 4);

    [0, 1].forEach((idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      const step = semitones[(offset + idx) % semitones.length];
      const freq = baseFreq * Math.pow(2, step / 12);

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now + idx * 0.07);
      gain.gain.setValueAtTime(0.2, now + idx * 0.07);
      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.25);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now + idx * 0.07);
      osc.stop(now + idx * 0.07 + 0.26);
    });
  }

  playWrong() {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(160, now);
    osc.frequency.linearRampToValueAtTime(110, now + 0.25);
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.26);
  }

  playCombo() {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    [587.33, 739.99, 880, 1174.66].forEach((f, i) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, now + i * 0.05);
      gain.gain.setValueAtTime(0.18, now + i * 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.3);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now + i * 0.05);
      osc.stop(now + i * 0.05 + 0.32);
    });
  }

  playBossHit() {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    // Low punch
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(120, now);
    osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
    gain.gain.setValueAtTime(0.35, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.32);
  }

  playVictory() {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
    notes.forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      const startTime = now + idx * 0.12;
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, startTime);
      gain.gain.setValueAtTime(0.25, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.45);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(startTime);
      osc.stop(startTime + 0.48);
    });
  }

  playHint() {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, now);
    osc.frequency.exponentialRampToValueAtTime(1760, now + 0.15);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.16);
  }
}

window.soundFX = new SoundFX();

// Custom Touch & Desktop Math Keypad
class MathKeypad {
  constructor() {
    this.container = null;
    this.targetInput = null;
    this.onSubmitCallback = null;
  }

  attach(inputElement, onSubmit) {
    this.targetInput = inputElement;
    this.onSubmitCallback = onSubmit;
    this.render();
  }

  render() {
    let wrap = document.getElementById('math-keypad-container');
    if (!wrap) return;

    wrap.innerHTML = `
      <div class="math-keypad">
        <div class="keypad-row">
          <button type="button" class="kp-btn kp-fn" data-val="/">/</button>
          <button type="button" class="kp-btn kp-fn" data-val="^">^</button>
          <button type="button" class="kp-btn kp-fn" data-val="√">√</button>
          <button type="button" class="kp-btn kp-fn" data-val="(">(</button>
          <button type="button" class="kp-btn kp-fn" data-val=")">)</button>
          <button type="button" class="kp-btn kp-fn" data-val="x">x</button>
        </div>
        <div class="keypad-grid">
          <button type="button" class="kp-btn" data-val="7">7</button>
          <button type="button" class="kp-btn" data-val="8">8</button>
          <button type="button" class="kp-btn" data-val="9">9</button>
          <button type="button" class="kp-btn kp-op" data-val="+">+</button>
          <button type="button" class="kp-btn kp-del" data-action="backspace">⌫</button>

          <button type="button" class="kp-btn" data-val="4">4</button>
          <button type="button" class="kp-btn" data-val="5">5</button>
          <button type="button" class="kp-btn" data-val="6">6</button>
          <button type="button" class="kp-btn kp-op" data-val="-">-</button>
          <button type="button" class="kp-btn kp-clear" data-action="clear">C</button>

          <button type="button" class="kp-btn" data-val="1">1</button>
          <button type="button" class="kp-btn" data-val="2">2</button>
          <button type="button" class="kp-btn" data-val="3">3</button>
          <button type="button" class="kp-btn kp-op" data-val="*">×</button>
          <button type="button" class="kp-btn kp-submit" data-action="submit">✓ Trả lời</button>

          <button type="button" class="kp-btn kp-zero" data-val="0">0</button>
          <button type="button" class="kp-btn" data-val=".">.</button>
          <button type="button" class="kp-btn kp-op" data-val="±">±</button>
          <button type="button" class="kp-btn kp-op" data-val="=">=</button>
        </div>
      </div>
    `;

    wrap.querySelectorAll('.kp-btn').forEach(btn => {
      btn.onclick = (e) => {
        e.preventDefault();
        window.soundFX?.playClick();
        const val = btn.getAttribute('data-val');
        const act = btn.getAttribute('data-action');

        if (!this.targetInput) return;

        if (act === 'backspace') {
          this.targetInput.value = this.targetInput.value.slice(0, -1);
        } else if (act === 'clear') {
          this.targetInput.value = '';
        } else if (act === 'submit') {
          if (this.onSubmitCallback) this.onSubmitCallback(this.targetInput.value.trim());
          return;
        } else if (val === '±') {
          if (this.targetInput.value.startsWith('-')) {
            this.targetInput.value = this.targetInput.value.substring(1);
          } else {
            this.targetInput.value = '-' + this.targetInput.value;
          }
        } else if (val) {
          this.targetInput.value += val;
        }

        // Trigger input event
        this.targetInput.dispatchEvent(new Event('input', { bubbles: true }));
        this.targetInput.focus();
      };
    });
  }

  detach() {
    let wrap = document.getElementById('math-keypad-container');
    if (wrap) wrap.innerHTML = '';
    this.targetInput = null;
    this.onSubmitCallback = null;
  }
}

// HÀNH TRÌNH TOÁN HỌC - MAIN CONTROLLER & APPLICATION LOGIC
// ==========================================================================

class MathApp {
  constructor() {
    this.currentRole = 'student'; // 'student' | 'admin'
    this.currentGrade = 6;
    this.currentView = 'learn'; // 'learn' | 'review' | 'leaderboard' | 'daily' | 'profile' | 'admin'
    this.currentStudent = null;

    // Game state
    this.activeSession = null;
    this.gameTimer = null;
    this.remainingSeconds = 0;
    this.totalSeconds = 30;

    this.initStorage();
  }

  initStorage() {
    // Tải hoặc khởi tạo danh sách học sinh
    if (!localStorage.getItem('htth_students')) {
      localStorage.setItem('htth_students', JSON.stringify(INITIAL_STUDENTS));
    }
    this.students = JSON.parse(localStorage.getItem('htth_students'));

    // Tải hoặc khởi tạo lịch sử hoạt động
    if (!localStorage.getItem('htth_activities')) {
      localStorage.setItem('htth_activities', JSON.stringify(INITIAL_ACTIVITY_LOGS));
    }
    this.activities = JSON.parse(localStorage.getItem('htth_activities'));

    // Tải hoặc khởi tạo ngân hàng câu hỏi
    if (!localStorage.getItem('htth_questions')) {
      localStorage.setItem('htth_questions', JSON.stringify(QUESTION_BANK));
    }
    this.questions = JSON.parse(localStorage.getItem('htth_questions'));

    // Học sinh hiện tại đăng nhập (mặc định chọn học sinh đầu tiên)
    let savedStudentId = localStorage.getItem('htth_current_student_id');
    this.currentStudent = this.students.find(s => s.id === savedStudentId) || this.students[0];
    this.currentGrade = this.currentStudent.grade || 6;
  }

  saveStorage() {
    localStorage.setItem('htth_students', JSON.stringify(this.students));
    localStorage.setItem('htth_activities', JSON.stringify(this.activities));
    localStorage.setItem('htth_questions', JSON.stringify(this.questions));
    if (this.currentStudent) {
      localStorage.setItem('htth_current_student_id', this.currentStudent.id);
    }
  }

  init() {
    this.renderHeader();
    this.renderBottomNav();
    this.bindGlobalEvents();
    this.switchView('learn');
  }

  // Render Math with KaTeX or fallback
  renderMath(element) {
    if (!element) return;
    
    // Nếu có KaTeX từ CDN
    if (window.renderMathInElement) {
      try {
        window.renderMathInElement(element, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false }
          ],
          throwOnError: false
        });
        return;
      } catch (e) {
        console.warn('KaTeX render error:', e);
      }
    }

    // Fallback Math Parser nếu offline / không tải được KaTeX CDN
    let html = element.innerHTML;
    html = html.replace(/\$([^\$]+)\$/g, (match, formula) => {
      let parsed = formula
        .replace(/\\frac\{([^}]+)\}\{([^}]+)\}/g, '<span class="math-frac"><span class="math-num">$1</span><span class="math-denom">$2</span></span>')
        .replace(/\\sqrt\{([^}]+)\}/g, '√($1)')
        .replace(/\\times/g, '×')
        .replace(/\\cdot/g, '·')
        .replace(/\\pm/g, '±')
        .replace(/\\le/g, '≤')
        .replace(/\\ge/g, '≥')
        .replace(/\\ne/g, '≠')
        .replace(/\\in/g, '∈')
        .replace(/\\notin/g, '∉')
        .replace(/\\subset/g, '⊂')
        .replace(/\\Rightarrow/g, '⇒')
        .replace(/\\Delta/g, 'Δ')
        .replace(/\\pi/g, 'π')
        .replace(/\^([0-9a-zA-Z]+)/g, '<sup>$1</sup>')
        .replace(/\^\{([^}]+)\}/g, '<sup>$1</sup>')
        .replace(/_([0-9a-zA-Z]+)/g, '<sub>$1</sub>')
        .replace(/_\{([^}]+)\}/g, '<sub>$1</sub>');
      return `<span class="math-render">${parsed}</span>`;
    });
    element.innerHTML = html;
  }

  // Header Bar
  renderHeader() {
    const header = document.getElementById('app-header');
    if (!header) return;

    if (this.currentRole === 'admin') {
      header.innerHTML = `
        <div class="brand-section" onclick="app.switchView('admin')">
          <div class="brand-logo" style="background: linear-gradient(135deg, #ef4444, #f97316);">🛡️</div>
          <div class="brand-info">
            <h1>QUẢN TRỊ VIÊN</h1>
            <p>Bảng theo dõi học sinh & Quản lý</p>
          </div>
        </div>
        <div class="header-stats">
          <button class="role-pill" onclick="app.toggleRole('student')">
            <span>🎓</span> Chuyển sang Học sinh

        </div>
      `;
    } else {
      header.innerHTML = `
        <div class="brand-section" onclick="app.switchView('learn')">
          <div class="brand-logo">📐</div>
          <div class="brand-info">
            <h1>HÀNH TRÌNH TOÁN HỌC</h1>

            <span>🔥</span> <span>${this.currentStudent.streak}</span>
          </div>
          <div class="stat-chip xp" title="Điểm kinh nghiệm XP">
            <span>⚡</span> <span>${this.currentStudent.xp}</span>
          </div>
          <button class="role-pill" onclick="app.toggleRole('admin')" title="Vào xem màn hình giáo viên/admin">
            <span>⚙️</span> Admin
          </button>
        </div>
      `;
    }
  }

  // Bottom Navigation (Mobile)
  renderBottomNav() {
    const nav = document.getElementById('bottom-nav');
    if (!nav) return;

    if (this.currentRole === 'admin') {
      nav.classList.add('d-none');
      return;
    }
    nav.classList.remove('d-none');

    const items = [
      { id: 'learn', icon: '🗺️', label: 'Học tập' },
      { id: 'review', icon: '🧠', label: 'Ôn tập' },
      { id: 'leaderboard', icon: '🏆', label: 'Xếp hạng' },
      { id: 'daily', icon: '⭐', label: 'Thử thách' },
      { id: 'profile', icon: '👤', label: 'Tôi' }
    ];

    nav.innerHTML = items.map(item => `
      <button class="nav-item ${this.currentView === item.id ? 'active' : ''}" onclick="app.switchView('${item.id}')">
        <span class="nav-icon">${item.icon}</span>
        <span>${item.label}</span>
      </button>
    `).join('');
  }

  toggleRole(targetRole) {
    window.soundFX?.playClick();
    this.currentRole = targetRole || (this.currentRole === 'admin' ? 'student' : 'admin');
    this.renderHeader();
    this.renderBottomNav();
    if (this.currentRole === 'admin') {
      this.switchView('admin');
    } else {
      this.switchView('learn');

  switchView(viewName) {
    window.soundFX?.playClick();
    this.currentView = viewName;
    this.renderBottomNav();

    const mainContainer = document.getElementById('main-content');
    if (!mainContainer) return;

    if (this.currentRole === 'admin' || viewName === 'admin') {
      this.renderAdminView(mainContainer);

      this.renderLeaderboardView(mainContainer);
    } else if (viewName === 'daily') {
      this.renderDailyChallengeView(mainContainer);
    } else if (viewName === 'profile') {
      this.renderProfileView(mainContainer);
    }

    this.renderMath(mainContainer);
  }

  // ========================================================================
  // VIEW: BẢN ĐỒ HỌC TẬP & CÁC CHƯƠNG (LEARN)
  // ========================================================================
  renderLearnView(container) {
    const kingdom = KINGDOMS.find(k => k.id === this.currentGrade) || KINGDOMS[0];

  // ========================================================================
  // GAMEPLAY: ARENA & CÂU HỎI (C1 - C3)
  // ========================================================================
  startLesson(lessonId, level = 1) {
    this.closeModal();

    // Lọc câu hỏi phù hợp với khối lớp và bài học hoặc câu hỏi tương tự
    let questions = this.questions.filter(q => q.grade === this.currentGrade && (q.lesson_id === lessonId || q.level === level));
    if (questions.length === 0) {
      questions = this.questions.filter(q => q.grade === this.currentGrade);
    }
    // Nếu vẫn ít, lấy từ ngân hàng chung
    if (questions.length === 0) {
      questions = this.questions;
    }

    // Xáo trộn ngẫu nhiên và lấy 3-5 câu cho một lượt chơi linh hoạt
    const selectedQuestions = [...questions].sort(() => 0.5 - Math.random()).slice(0, 4);

    this.activeSession = {
      type: 'lesson',
      lessonId: lessonId,
      level: level,
      questions: selectedQuestions,
      currentIndex: 0,
      score: 0,
      combo: 0,
      correctCount: 0,
      hintsUsedThisRound: 0,
      hintsUsedThisQuestion: 0,
      startTime: Date.now(),
      wrongQuestions: []
    };

    this.renderGameArena();
  }

  startBossBattle(chapterId) {
    this.closeModal();
    const kingdom = KINGDOMS.find(k => k.id === this.currentGrade);
    const chapter = kingdom.chapters.find(c => c.id === chapterId);

    let questions = this.questions.filter(q => q.grade === this.currentGrade);
    if (questions.length === 0) questions = this.questions;
    const selectedQuestions = [...questions].sort(() => 0.5 - Math.random()).slice(0, 5);

    this.activeSession = {
      type: 'boss',
      chapter: chapter,
      bossHpMax: chapter.bossHp,
      bossHpCurrent: chapter.bossHp,
      questions: selectedQuestions,
      currentIndex: 0,
      score: 0,
      combo: 0,
      correctCount: 0,
      hintsUsedThisRound: 0,
      hintsUsedThisQuestion: 0,
      startTime: Date.now(),
      wrongQuestions: []
    };

    this.renderGameArena();
  }

  renderGameArena() {

    const s = this.activeSession;
    const q = s.questions[s.currentIndex];
    this.totalSeconds = q.time_limit_sec || 30;
    this.remainingSeconds = this.totalSeconds;
    s.hintsUsedThisQuestion = 0;

    mainContainer.innerHTML = `
      <div class="view-container">
        <div class="game-arena">
          <!-- Thanh trạng thái thời gian và điểm số -->

            <div class="timer-bar-wrap">

            </div>

            </div>
            <div style="font-weight: 800; color: #38bdf8; font-size: 15px;">
              ${s.score} đ
            </div>
          </div>

          <!-- Màn hình Boss (nếu đang đánh boss) -->
          ${s.type === 'boss' ? `
            <div class="boss-arena-header">

              <div class="boss-info">

                  <span style="color: #fca5a5;">${s.chapter.bossName}</span>
                  <span id="boss-hp-text" style="color: #f87171;">${s.bossHpCurrent} / ${s.bossHpMax} HP</span>
                </div>
                <div class="boss-hp-bar">
                  <div id="boss-hp-bar-fill" class="boss-hp-fill" style="width: ${(s.bossHpCurrent / s.bossHpMax) * 100}%;"></div>
                </div>
              </div>
            </div>
          ` : ''}

          <!-- Thẻ câu hỏi chính -->
          <div class="question-card">
            <div class="question-header">
              <span class="question-type-tag">Câu ${s.currentIndex + 1}/${s.questions.length} • Dạng: ${q.type}</span>
              <button class="btn btn-secondary btn-sm" onclick="app.useHint()">💡 Gợi ý</button>
            </div>

            <!-- Nội dung câu hỏi stem -->
            <div class="question-stem" id="question-stem-text">
              ${q.stem}
            </div>

            <!-- Khu vực tương tác trả lời tùy theo dạng câu hỏi -->
            <div id="question-action-area" style="margin-top: 10px;">
              ${this.renderQuestionActionArea(q)}
            </div>
          </div>

          <!-- Bàn phím toán (nếu là dạng NUM) -->
          <div id="math-keypad-container"></div>
        </div>
      </div>
    `;

    this.renderMath(document.getElementById('question-stem-text'));
    this.renderMath(document.getElementById('question-action-area'));

    // Gắn bàn phím toán nếu dạng NUM
    if (q.type === 'NUM') {
      const numInput = document.getElementById('num-answer-input');
      if (numInput && window.mathKeypad) {
        window.mathKeypad.attach(numInput, (val) => this.submitNumAnswer(val));
      }
    }

    this.startTimer();

  renderQuestionActionArea(q) {
    if (q.type === 'MCQ') {
      const letters = ['A', 'B', 'C', 'D'];
      return `
        <div class="options-grid">
          ${q.options.map((opt, i) => `
            <button class="option-btn" onclick="app.submitMcqAnswer(${i}, this)">
              <span class="option-letter">${letters[i]}</span>
              <span class="option-text">${opt.text}</span>
            </button>
          `).join('')}
        </div>
      `;
    } else if (q.type === 'NUM') {
      return `
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <input type="text" id="num-answer-input" class="form-control" placeholder="Nhập đáp số..." 
                 style="font-size: 20px; font-weight: 700; text-align: center; height: 50px;" readonly />
        </div>
      `;
    } else if (q.type === 'ERR') {
      return `
        <div class="err-steps-list">
          <p style="font-size: 13px; color: #cbd5e1; margin-bottom: 6px;">👉 Hãy bấm trực tiếp vào dòng mà bạn cho rằng bị biến đổi sai:</p>
          ${q.steps.map(step => `
            <div class="err-step-card" onclick="app.submitErrAnswer(${step.num}, this)">
              <span style="font-weight: 600;">${step.text}</span>
              <span style="font-size: 16px;">🔍</span>
            </div>
          `).join('')}
        </div>
      `;
    } else if (q.type === 'ORDER') {
      return `
        <div class="order-list" id="order-items-wrap">
          <p style="font-size: 13px; color: #cbd5e1; margin-bottom: 6px;">👉 Di chuyển các bước để sắp xếp đúng thứ tự giải:</p>
          ${q.items.map((item, idx) => `
            <div class="order-item" data-id="${item.id}">
              <span>${item.text}</span>
              <div class="order-btns-group">
                <button type="button" class="order-nav-btn" onclick="app.moveOrderItem(${idx}, -1)">▲</button>
                <button type="button" class="order-nav-btn" onclick="app.moveOrderItem(${idx}, 1)">▼</button>
              </div>
            </div>
          `).join('')}

    return `<button class="btn btn-primary" onclick="app.proceedNextQuestion(true)">Tiếp tục</button>`;
  }

  // Timer loop
  startTimer() {
    clearInterval(this.gameTimer);
    const timerFill = document.getElementById('game-timer-fill');

    this.gameTimer = setInterval(() => {
      this.remainingSeconds -= 0.1;
      const pct = Math.max(0, (this.remainingSeconds / this.totalSeconds) * 100);

      if (timerFill) {
        timerFill.style.width = pct + '%';
        if (pct < 25) {
          timerFill.className = 'timer-bar-fill danger';
        } else if (pct < 50) {
          timerFill.className = 'timer-bar-fill warning';
        } else {
          timerFill.className = 'timer-bar-fill';
        }
      }

      if (this.remainingSeconds <= 0) {
        clearInterval(this.gameTimer);
        this.handleTimeout();
      }
    }, 100);
  }

  handleTimeout() {
    window.soundFX?.playWrong();
    this.showExplanationModal(false, null, "Hết thời gian trả lời!");
  }

  useHint() {
    const s = this.activeSession;
    const q = s.questions[s.currentIndex];
    if (!q.hints || q.hints.length === 0) {
      alert("Câu này không có thêm gợi ý!");
      return;
    }
    window.soundFX?.playHint();
    s.hintsUsedThisRound++;
    s.hintsUsedThisQuestion = Math.min(2, s.hintsUsedThisQuestion + 1);

    const hintText = q.hints[s.hintsUsedThisQuestion - 1] || q.hints[0];
    alert(`💡 GỢI Ý (${s.hintsUsedThisQuestion}/2):\n${hintText}`);
  }

  // Submit MCQ Answer
  submitMcqAnswer(optIndex, btnElement) {
    clearInterval(this.gameTimer);
    const s = this.activeSession;
    const q = s.questions[s.currentIndex];
    const selectedOpt = q.options[optIndex];

    const allBtns = document.querySelectorAll('.option-btn');
    allBtns.forEach(b => b.disabled = true);

    if (selectedOpt.correct) {
      btnElement.classList.add('correct');
      this.handleAnswerResult(true, selectedOpt);
    } else {
      btnElement.classList.add('wrong');
      // Highlight correct one
      const correctIdx = q.options.findIndex(o => o.correct);
      if (allBtns[correctIdx]) allBtns[correctIdx].classList.add('correct');
      this.handleAnswerResult(false, selectedOpt);
    }
  }

  // Submit NUM Answer
  submitNumAnswer(val) {
    if (!val) return;
    clearInterval(this.gameTimer);
    const s = this.activeSession;
    const q = s.questions[s.currentIndex];

    const isCorrect = String(val).trim() === String(q.correct_num).trim();
    this.handleAnswerResult(isCorrect, null, isCorrect ? null : `Đáp án đúng là: ${q.correct_num}`);
  }

  // Submit ERR Answer (Thám tử lỗi sai)
  submitErrAnswer(stepNum, element) {
    clearInterval(this.gameTimer);
    const s = this.activeSession;
    const q = s.questions[s.currentIndex];

    const isCorrect = stepNum === q.wrong_step_num;
    if (isCorrect) {
      element.classList.add('selected-wrong');
      element.style.borderColor = '#10b981';
      element.style.background = 'rgba(16, 185, 129, 0.2)';
    } else {
      element.classList.add('selected-wrong');
    }

    this.handleAnswerResult(isCorrect, null, q.explain);
  }

  // Submit ORDER Answer
  moveOrderItem(index, direction) {
    const s = this.activeSession;
    const q = s.questions[s.currentIndex];
    const newIdx = index + direction;
    if (newIdx < 0 || newIdx >= q.items.length) return;

    const temp = q.items[index];
    q.items[index] = q.items[newIdx];
    q.items[newIdx] = temp;

    // Rerender order wrap
    const wrap = document.getElementById('question-action-area');
    if (wrap) {
      wrap.innerHTML = this.renderQuestionActionArea(q);
      this.renderMath(wrap);
    }
  }

  submitOrderAnswer() {
    clearInterval(this.gameTimer);
    const s = this.activeSession;
    const q = s.questions[s.currentIndex];
    const currentOrder = q.items.map(i => i.id);

    const isCorrect = JSON.stringify(currentOrder) === JSON.stringify(q.correct_order);
    this.handleAnswerResult(isCorrect, null);
  }

  // Handle Result of Answer (Scoring formula from section 9)
  handleAnswerResult(isCorrect, selectedOpt = null, customExplain = null) {
    const s = this.activeSession;
    const q = s.questions[s.currentIndex];

    if (isCorrect) {
      s.correctCount++;
      s.combo++;
      window.soundFX?.playCorrect(s.combo);

      // Công thức điểm Section 9:
      // D = C * (1 + 0.3 * t) * (1 + 0.05 * k) * (1 - 0.25 * g)
      const basePoints = [10, 15, 20, 30][(s.level || 1) - 1] || 10;
      const t = Math.max(0, Math.min(1, this.remainingSeconds / this.totalSeconds));
      const k = Math.min(5, s.combo);
      const g = Math.min(2, s.hintsUsedThisQuestion);

      const earned = Math.round(basePoints * (1 + 0.3 * t) * (1 + 0.05 * k) * (1 - 0.25 * g));
      s.score += earned;

      // Boss hit animation
      if (s.type === 'boss') {
        const damage = Math.round(s.bossHpMax / s.questions.length);
        s.bossHpCurrent = Math.max(0, s.bossHpCurrent - damage);
        window.soundFX?.playBossHit();
      }
    } else {
      s.combo = 0; // Ngắt chuỗi combo
      window.soundFX?.playWrong();
      s.wrongQuestions.push(q);
    }

    this.showExplanationModal(isCorrect, selectedOpt, customExplain);
  }

  // Modal giải thích sau câu (C2) kèm lỗi sai phổ biến
  showExplanationModal(isCorrect, selectedOpt, customExplain) {
    const s = this.activeSession;
    const q = s.questions[s.currentIndex];

    const modal = document.getElementById('app-modal');
    const modalBody = document.getElementById('modal-content-area');

    let errorReasonHtml = '';
    if (!isCorrect && selectedOpt && selectedOpt.explain) {
      errorReasonHtml = `

  proceedNextQuestion() {
    this.closeModal();
    const s = this.activeSession;
    s.currentIndex++;

    if (s.currentIndex < s.questions.length) {
      this.renderGameArena();
    } else {
      this.finishSession();
    }
  }

  // Kết thúc lượt chơi & Tính sao (C3)
  finishSession() {
    clearInterval(this.gameTimer);
    const s = this.activeSession;
    const accuracy = Math.round((s.correctCount / s.questions.length) * 100);

    // Quy tắc đạt sao (Section 2)
    let stars = 0;
    if (accuracy >= 95 && s.hintsUsedThisRound <= 1) stars = 3;
    else if (accuracy >= 80) stars = 2;
    else if (accuracy >= 60) stars = 1;

    // Cộng XP cho học sinh
    const earnedXp = s.score + (stars * 20);
    this.currentStudent.xp += earnedXp;
    this.currentStudent.gamesPlayed = (this.currentStudent.gamesPlayed || 0) + 1;

    // Đánh dấu hoàn thành bài
    if (s.type === 'lesson') {
      if (!this.currentStudent.completedLessons) this.currentStudent.completedLessons = [];
      if (!this.currentStudent.completedLessons.includes(s.lessonId)) {
        this.currentStudent.completedLessons.push(s.lessonId);
      }
      if (!this.currentStudent.lessonStars) this.currentStudent.lessonStars = {};
      this.currentStudent.lessonStars[s.lessonId] = Math.max(this.currentStudent.lessonStars[s.lessonId] || 0, stars);
    }

    // Ghi nhật ký hoạt động thời gian thực cho Admin theo dõi
    const timeSpentSec = Math.round((Date.now() - s.startTime) / 1000);
    const timeFormatted = `${Math.floor(timeSpentSec / 60)}m ${timeSpentSec % 60}s`;

    const newActivity = {
      id: 'act_' + Date.now(),
      studentId: this.currentStudent.id,
      studentName: this.currentStudent.name,
      nickname: this.currentStudent.nickname,
      grade: this.currentGrade,
      lessonTitle: s.type === 'boss' ? `Đại chiến Boss: ${s.chapter.bossName}` : `Bài tập Cấp ${s.level}`,
      mode: s.type === 'boss' ? 'Đại chiến Boss' : 'Tính nhanh',
      score: s.score,
      stars: stars,
      accuracy: accuracy,
      timeSpent: timeFormatted,
      timestamp: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
      status: timeSpentSec < 5 && accuracy === 100 ? 'flagged_cheat' : (stars > 0 ? 'passed' : 'failed')
    };

    this.activities.unshift(newActivity);
    this.saveStorage();

    if (stars > 0) window.soundFX?.playVictory();

    // Hiển thị modal kết quả
    const modal = document.getElementById('app-modal');
    const modalBody = document.getElementById('modal-content-area');

    modalBody.innerHTML = `
      <div class="modal-header">
        <h3>🏆 KẾT QUẢ LƯỢT CHƠI</h3>
      </div>
      <div class="modal-body text-center">
        <!-- Huy hiệu sao -->
        <div style="font-size: 42px; color: #fbbf24; margin: 10px 0; letter-spacing: 6px;">
          ${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}
        </div>
        <h2 style="font-size: 22px; font-weight: 800; color: #f8fafc;">
          ${stars === 3 ? 'Tuyệt đỉnh Toán học!' : (stars >= 1 ? 'Chúc mừng bạn đã vượt qua!' : 'Cố gắng thêm một chút nhé!')}
        </h2>

        <!-- Bảng thống kê điểm & kinh nghiệm -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0;">
          <div style="background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px;">
            <div style="font-size: 11px; color: var(--text-muted);">ĐIỂM ĐẠT ĐƯỢC</div>
            <div style="font-size: 22px; font-weight: 800; color: #38bdf8;">${s.score}</div>
          </div>
          <div style="background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px;">
            <div style="font-size: 11px; color: var(--text-muted);">KINH NGHIỆM (XP)</div>
            <div style="font-size: 22px; font-weight: 800; color: #10b981;">+${earnedXp}</div>
          </div>
          <div style="background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px;">
            <div style="font-size: 11px; color: var(--text-muted);">ĐỘ CHÍNH XÁC</div>
            <div style="font-size: 22px; font-weight: 800; color: #f59e0b;">${accuracy}%</div>
          </div>
          <div style="background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px;">

            Xem Bảng Hạng 🏅

        </div>

    `;

    modal.classList.add('active');
  }

    if (btn) btn.classList.add('active');

    const contentArea = document.getElementById('admin-tab-content');
    if (!contentArea) return;

    if (tabName === 'activity') {
      contentArea.innerHTML = this.renderAdminActivityTab();
    } else if (tabName === 'students') {
      contentArea.innerHTML = this.renderAdminStudentsTab();
    } else if (tabName === 'errors') {
      contentArea.innerHTML = this.renderAdminErrorsTab();
    } else if (tabName === 'questions') {
      contentArea.innerHTML = this.renderAdminQuestionsTab();
    }

    this.renderMath(contentArea);
  }

  // TAB 1: NHẬT KÝ HOẠT ĐỘNG THỜI GIAN THỰC (LIVE ACTIVITY FEED)
  renderAdminActivityTab() {
    return `
      <div class="table-card">
        <div style="padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
          <h3 style="font-size: 15px; font-weight: 700;">📡 Dòng sự kiện luyện tập vừa diễn ra:</h3>
          <span style="font-size: 12px; color: #10b981; display: flex; align-items: center; gap: 6px;">
            <span style="width: 8px; height: 8px; background: #10b981; border-radius: 50%; display: inline-block;"></span>
            Tự động cập nhật
          </span>
        </div>
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Thời Gian</th>
                <th>Học Sinh</th>
                <th>Khối Lớp</th>
                <th>Bài Học & Chế Độ</th>
                <th>Điểm / Sao</th>
                <th>Độ Chính Xác</th>
                <th>Thời Lượng</th>
                <th>Trạng Thái</th>
              </tr>
            </thead>
            <tbody>
              ${this.activities.map(act => `
                <tr>
                  <td style="color: var(--text-muted);">${act.timestamp}</td>
                  <td>
                    <strong>${act.studentName}</strong>
                    <div style="font-size: 11px; color: var(--text-muted);">${act.nickname}</div>
                  </td>
                  <td>Lớp ${act.grade}</td>
                  <td>
                    <div>${act.lessonTitle}</div>
                    <span style="font-size: 11px; color: #38bdf8;">${act.mode}</span>
                  </td>
                  <td>
                    <span style="color: #38bdf8; font-weight: 700;">${act.score} đ</span>
                    <span style="color: #fbbf24; margin-left: 4px;">${'★'.repeat(act.stars || 0)}</span>
                  </td>
                  <td>
                    <span style="font-weight: 700; color: ${act.accuracy >= 80 ? '#10b981' : (act.accuracy >= 50 ? '#f59e0b' : '#ef4444')};">
                      ${act.accuracy}%
                    </span>
                  </td>
                  <td>${act.timeSpent}</td>
                  <td>
                    ${act.status === 'flagged_cheat' ? `
                      <span class="tag-badge flagged">⚠️ Nghi vấn hack</span>
                      <button class="btn btn-danger btn-sm" style="margin-left: 6px; padding: 2px 6px;" onclick="app.banStudent('${act.studentId}')">Xử lý</button>
                    ` : (act.status === 'boss_slain' ? `
                      <span class="tag-badge" style="background: rgba(168, 85, 247, 0.2); color: #c084fc;">⚔️ Diệt Boss</span>
                    ` : `
                      <span class="tag-badge active">✓ Hoàn thành</span>
                    `)}
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  // TAB 2: DANH SÁCH HỌC SINH & CHI TIẾT
  renderAdminStudentsTab() {
    return `
      <div class="table-card">
        <div style="padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
          <h3 style="font-size: 15px; font-weight: 700;">Hồ sơ học sinh tham gia học tập:</h3>
          <input type="text" placeholder="Tìm tên, trường, lớp..." class="form-control" style="width: 240px; padding: 6px 12px; font-size: 13px;" oninput="app.filterStudentsList(this.value)" />
        </div>
        <div class="table-responsive">
          <table class="data-table" id="students-admin-table">
            <thead>
              <tr>
                <th>Học Sinh</th>
                <th>Khối Lớp</th>
                <th>Trường / Lớp</th>
                <th>XP & Cấp</th>
                <th>Tổng Sao</th>
                <th>Độ Chính Xác</th>
                <th>Hoạt Động Cuối</th>
                <th>Thao Tác</th>
              </tr>
            </thead>
            <tbody>
              ${this.students.map(st => `
                <tr>
                  <td>
                    <div style="display: flex; align-items: center; gap: 8px;">
                      <span style="font-size: 20px;">${st.avatar}</span>
                      <div>
                        <strong>${st.name}</strong>
                        <div style="font-size: 11px; color: var(--text-muted);">${st.nickname} (${st.username})</div>
                      </div>
                    </div>
                  </td>
                  <td>Lớp ${st.grade}</td>
                  <td>${st.school} <br/><span style="color: var(--text-muted); font-size: 11px;">Mã lớp: ${st.classCode}</span></td>
                  <td>
                    <span style="color: #38bdf8; font-weight: 700;">${st.xp} XP</span>
                    <div style="font-size: 11px; color: var(--text-muted);">Cấp độ ${st.level}</div>
                  </td>
                  <td><span style="color: #fbbf24; font-weight: 700;">${st.stars} ⭐</span></td>
                  <td><span style="color: #10b981; font-weight: 700;">${st.accuracy}%</span></td>
                  <td style="color: var(--text-muted);">${st.lastActive}</td>

        </div>
      </div>

  }

  // TAB 3: HEATMAP NHỮNG CHỖ HỌC SINH HAY SAI (ERROR HEATMAP)
  renderAdminErrorsTab() {
    return `
      <div style="display: flex; flex-direction: column; gap: 16px;">
        <div style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: var(--radius-lg); padding: 16px;">
          <h3 style="font-size: 16px; font-weight: 800; color: #fca5a5;">🔥 THỐNG KÊ NHỮNG LỖI SAI TOÁN HỌC PHỔ BIẾN NHẤT</h3>
          <p style="font-size: 13px; color: #fecaca; margin-top: 4px;">
            Hệ thống tự động phân loại đáp án nhiễu theo mã lỗi sai để giúp thầy cô biết học sinh đang vướng mắc ở khái niệm nào:
          </p>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px;">
          ${COMMON_ERROR_STATS.map(err => `
            <div class="chapter-card" style="padding: 16px;">
              <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div>
                  <span class="tag-badge" style="background: rgba(99, 102, 241, 0.2); color: #c7d2fe; margin-bottom: 6px;">
                    Lớp ${err.grade} • ${err.lesson}
                  </span>
                  <h4 style="font-size: 15px; font-weight: 700; color: #f8fafc;">${err.title}</h4>
                </div>
                <div style="font-size: 22px; font-weight: 800; color: #ef4444;">${err.percentage}</div>
              </div>

              <!-- Thanh tỉ lệ lỗi -->
              <div style="height: 8px; background: rgba(0,0,0,0.4); border-radius: var(--radius-full); margin: 12px 0; overflow: hidden;">
                <div style="height: 100%; width: ${err.percentage}; background: linear-gradient(to right, #f59e0b, #ef4444);"></div>
              </div>

              <div style="background: rgba(0,0,0,0.2); padding: 10px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 8px;">
                <span style="color: #f87171; font-weight: 700;">Học sinh hay viết:</span> 
                <span class="math-target">${err.formula}</span>
              </div>

              <div style="color: #34d399; font-size: 12px; font-weight: 600;">
                💡 Khắc phục: <span class="math-target">${err.correctNotice}</span>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  // TAB 4: QUẢN LÝ NGÂN HÀNG CÂU HỎI
  renderAdminQuestionsTab() {
    return `
      <div class="table-card">
        <div style="padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
          <h3 style="font-size: 15px; font-weight: 700;">Kho câu hỏi có sẵn (Xem trước KaTeX):</h3>
          <button class="btn btn-primary btn-sm" onclick="app.openAddQuestionModal()">+ Thêm Câu Hỏi</button>
        </div>
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Mã ID</th>
                <th>Khối</th>
                <th>Dạng</th>
                <th>Cấp Độ</th>
                <th>Nội Dung Câu Hỏi (KaTeX)</th>
                <th>Thao Tác</th>
              </tr>
            </thead>
            <tbody>
              ${this.questions.map(q => `
                <tr>
                  <td style="color: var(--text-muted); font-size: 11px;">${q.id}</td>
                  <td>Lớp ${q.grade}</td>
                  <td><span class="tag-badge" style="background: rgba(99, 102, 241, 0.2); color: #c7d2fe;">${q.type}</span></td>
                  <td>Cấp ${q.level}</td>
                  <td style="max-width: 400px;">
                    <div>${q.stem}</div>
                  </td>
                  <td>
                    <button class="btn btn-secondary btn-sm" onclick="app.previewQuestion('${q.id}')">Xem Thử</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  // Xem chi tiết học sinh
  inspectStudent(studentId) {
    const st = this.students.find(s => s.id === studentId);
    if (!st) return;

    const modal = document.getElementById('app-modal');
    const modalBody = document.getElementById('modal-content-area');

    modalBody.innerHTML = `
      <div class="modal-header">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="font-size: 28px;">${st.avatar}</span>
          <div>
            <h3>${st.name} (${st.nickname})</h3>
            <p style="font-size: 12px; color: var(--text-muted);">${st.school} • ${st.classCode} • Khối Lớp ${st.grade}</p>
          </div>
        </div>
        <button class="modal-close-btn" onclick="app.closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="admin-kpi-grid">
          <div class="kpi-card">
            <span class="kpi-label">TỔNG XP</span>
            <span class="kpi-value">${st.xp}</span>
          </div>
          <div class="kpi-card">
            <span class="kpi-label">SỐ LƯỢT CHƠI</span>
            <span class="kpi-value">${st.gamesPlayed}</span>
          </div>
          <div class="kpi-card">
            <span class="kpi-label">TỔNG SAO</span>
            <span class="kpi-value" style="color: #fbbf24;">${st.stars} ⭐</span>
          </div>
          <div class="kpi-card">
            <span class="kpi-label">ĐỘ CHÍNH XÁC</span>
            <span class="kpi-value" style="color: #10b981;">${st.accuracy}%</span>
          </div>
        </div>

        ${st.flagReason ? `
          <div style="background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; border-radius: var(--radius-md); padding: 12px;">
            <div style="color: #fca5a5; font-weight: 700; font-size: 13px;">⚠️ CẢNH BÁO GIAN LẬN:</div>
            <div style="color: #fecaca; font-size: 13px; margin-top: 4px;">${st.flagReason}</div>
          </div>
        ` : ''}

        <h4 style="font-size: 14px; font-weight: 700; color: #f8fafc; margin-top: 10px;">Thao tác quản trị viên:</h4>
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-secondary" onclick="app.resetStudentScore('${st.id}')">Reset Điểm Về 0</button>
          <button class="btn btn-danger" onclick="app.banStudent('${st.id}')">Khóa Tài Khoản Này</button>
        </div>
      </div>
    `;

    modal.classList.add('active');
  }

  resetStudentScore(studentId) {
    const st = this.students.find(s => s.id === studentId);
    if (!st) return;
    if (confirm(`Bạn có chắc chắn muốn reset điểm của học sinh ${st.name}?`)) {
      st.xp = 0;
      st.stars = 0;
      st.status = 'active';
      st.flagReason = null;
      this.saveStorage();
      alert("Đã reset điểm thành công!");
      this.closeModal();
      this.switchAdminTab('students');
    }
  }

  banStudent(studentId) {
    const st = this.students.find(s => s.id === studentId);
    if (!st) return;
    if (confirm(`Bạn có chắc muốn đình chỉ tài khoản của ${st.name}?`)) {
      st.status = 'banned';
      this.saveStorage();
      alert("Đã đình chỉ tài khoản thành công!");
      this.closeModal();
      this.switchAdminTab('students');
    }
  }

  openAddQuestionModal() {
    const modal = document.getElementById('app-modal');
    const modalBody = document.getElementById('modal-content-area');

    modalBody.innerHTML = `
      <div class="modal-header">
        <h3>+ THÊM CÂU HỎI MỚI VÀO KHO ĐỀ</h3>
        <button class="modal-close-btn" onclick="app.closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Khối lớp:</label>
          <select id="new-q-grade" class="form-control">
            <option value="6">Lớp 6 (Vương quốc Rừng Xanh)</option>
            <option value="7">Lớp 7 (Vương quốc Đại Dương)</option>
            <option value="8">Lớp 8 (Vương quốc Công Nghệ)</option>
            <option value="9">Lớp 9 (Vương quốc Vũ Trụ)</option>
          </select>
        </div>

        <div class="form-group">
          <label>Dạng câu hỏi:</label>
          <select id="new-q-type" class="form-control">
            <option value="MCQ">MCQ - Trắc nghiệm 1 đáp án</option>
            <option value="NUM">NUM - Điền số / Bàn phím toán</option>
          </select>
        </div>

        <div class="form-group">
          <label>Đề bài (Hỗ trợ công thức toán KaTeX ví dụ $(x+2)^2$):</label>
          <textarea id="new-q-stem" class="form-control" rows="3" placeholder="Nhập đề bài toán học..."></textarea>
        </div>

        <div class="form-group">
          <label>Đáp án đúng:</label>
          <input type="text" id="new-q-correct" class="form-control" placeholder="Đáp án đúng (ví dụ: $x^2+4x+4$ hoặc 12)" />
        </div>

        <div class="form-group">
          <label>Đáp án nhiễu (kèm lỗi học sinh hay mắc):</label>
          <input type="text" id="new-q-wrong1" class="form-control" placeholder="Đáp án sai (ví dụ: $x^2+4$ - thiếu 2ab)" />
        </div>

        <button class="btn btn-primary" onclick="app.saveNewQuestion()">
          Lưu Câu Hỏi Vào Hệ Thống
        </button>
      </div>
    `;

    modal.classList.add('active');
  }

  saveNewQuestion() {
    const grade = parseInt(document.getElementById('new-q-grade').value);
    const type = document.getElementById('new-q-type').value;
    const stem = document.getElementById('new-q-stem').value.trim();
    const correct = document.getElementById('new-q-correct').value.trim();
    const wrong1 = document.getElementById('new-q-wrong1').value.trim();

    if (!stem || !correct) {
      alert("Vui lòng nhập đề bài và đáp án đúng!");
      return;
    }

    const newQ = {
      id: 'q_custom_' + Date.now(),
      grade: grade,
      level: 1,
      type: type,
      stem: stem,
      options: type === 'MCQ' ? [
        { text: correct, correct: true },
        { text: wrong1 || 'Không đúng', error_code: 'general_error', explain: 'Đáp án chưa chính xác.' },
        { text: '0', error_code: 'zero_error' },
        { text: '1', error_code: 'one_error' }
      ] : undefined,
      correct_num: type === 'NUM' ? correct : undefined,
      solution_steps: ["Áp dụng đúng định nghĩa và công thức toán học."],
      time_limit_sec: 35
    };

    this.questions.push(newQ);
    this.saveStorage();
    alert("Đã thêm câu hỏi thành công!");
    this.closeModal();
    this.switchAdminTab('questions');
  }

  exportDataJson() {
    const data = {
      students: this.students,
      activities: this.activities,
      questions: this.questions,
      exportedAt: new Date().toISOString()
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `hanh-trinh-toan-hoc-backup-${Date.now()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  bindGlobalEvents() {
    // Đóng modal khi bấm ra ngoài nền
    const modal = document.getElementById('app-modal');
    if (modal) {
      modal.onclick = (e) => {
        if (e.target === modal) this.closeModal();
      };
    }
  }
}

// Khởi chạy ứng dụng
window.addEventListener('DOMContentLoaded', () => {
  window.app = new MathApp();
  window.app.init();
});

  </script>
</body>
